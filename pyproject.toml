[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpr-audio-generator"
version = "0.1.0"
description = "Audio-first, human-in-the-loop soundtrack generator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hpr-audio = "hpr_audio_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

